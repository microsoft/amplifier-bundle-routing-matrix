# Provisional time-to-success policy, NOT a measured speed winner.
# Start from balanced's current model families; spend less thinking on routine
# work, not on coding/UI/security/critical operations or native image generation.
# Retain stronger models for complex work to avoid cheap-but-repeated failures.
# No throughput, latency or calibrated quality-floor claim is made by these dials.
# See docs/MATRIX_CURATOR_GUIDE.md for the exact deltas and qualification boundary.
# No delegation preset: explicit caller choices retain existing resolver semantics.
name: speed
description: "Provisional time-to-success strategy with role quality floors; not a measured speed win."
updated: "2026-10-06"

roles:
  general:
    description: "Versatile catch-all, no specialization needed"
    candidates:
      - provider: openai
        model: gpt-6.1-sol
        config:
          reasoning_effort: low
      - provider: anthropic
        model: claude-sonnet-*
        config:
          reasoning_effort: medium
      - provider: gemini
        model: "gemini-[3-9]*-pro-preview"
        config:
          extra_request_params:
            thinking_config:
              thinking_level: medium
      - provider: github-copilot
        model: claude-sonnet-5.5
        config:
          reasoning_effort: medium
      - provider: github-copilot
        model: gpt-6.1-sol
        config:
          reasoning_effort: medium

  fast:
