# Routing Matrix: openai-cheap-fast
#
# OpenAI-only. EVERY role is pinned to the cheap rung (luna / mini / nano) at
# `reasoning_effort: medium`, whatever model the root session is running.
#
# WHAT THIS IS FOR, AND WHY IT IS NOT A DUPLICATE OF `openai.yaml`
# ---------------------------------------------------------------
# Since 2026-09-02 (#55) `openai.yaml` ships knob-consistent delegation ON by
# default: `inherit: strict` clamps a delegation tree to AT MOST the root's own
# rung. That is a ceiling, and a ceiling can never take a tree BELOW the root.
# So a terra-rooted session on `openai` gets a terra tree -- correctly, by
# design. This matrix is the other half of that shape: keep your root where it
# is, run the whole delegated tree cheap. Measured, at root
# `gpt-5.6-terra@medium`: 12 of 13 roles resolve differently here than under
# `openai.yaml` (docs/lanes/ytg-presets-revision/plan-equivalence.json).
#
# THE CONTRACT, STATED HONESTLY
# -----------------------------
# This matrix BUYS cost and wall clock and GIVES UP quality headroom. That is
# not a hedge, it is the measured shape:
#   * cost   -- a luna-pinned S3 tree measured $0.4183/run (range $0.3236-
#               $0.5274) against a terra tree's $1.0399 ($1.0342-$1.2638),
#               complete non-overlap at n=3 (lane 161-preset-validation).
#   * wall   -- the same arm was the FASTEST of five (235.6 s median).
#   * quality-- the same arm passed the S3 pass rule 1 of 3 times, versus 2/3
#               and 3/3 for the mid-tier arms. It scored 80/90/88; the recorded
#               `luna-medium` baseline median is 70. Do not select this matrix
#               for work where a missed revision or constraint is expensive.
# Gate evidence and the pre-registered thresholds this was held to:
# docs/lanes/ytg-presets-revision/{PREREGISTRATION,FINDINGS,DONE-NOTE}.md.
#
# NO `preset:` BLOCK, DELIBERATELY
# --------------------------------
# A `preset:` block would make the tree inherit the CALLER's effort, so a root
# at `high` would push these luna candidates to `high` and quietly stop being
# the thing that was measured. Pinned `medium` everywhere is exactly the arm on
# the evidence above. Cold or clamped, this matrix routes the same way.
#
# ANTHROPIC MAPPING: NOT SHIPPED HERE, ON PURPOSE
# -----------------------------------------------
# The haiku-rooted mapping of this preset is NOT included. Its quality
# non-inferiority is not established: lane 161's `cheap-fast-anth` run 02 scored
# 28 on S3, below all 10 recorded baseline haiku runs (range 38-88). Adding
# haiku candidates here would ship that unvalidated mapping silently. Users on
# the Anthropic path should keep `anthropic` (untouched, and guarded).
#
# Required roles: "general" and "fast" must be defined in every matrix.
# See docs/MATRIX_CURATOR_GUIDE.md for schema details.

name: openai-cheap-fast
description: "OpenAI-only, cheap-rung everywhere: every role pinned to gpt-?.?-luna* @ medium regardless of the root model. Buys cost and wall clock, gives up quality headroom."
updated: "2026-09-02"

