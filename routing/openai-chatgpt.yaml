# Routing Matrix: openai-chatgpt
#
# Central routing ownership: this built-in matrix is the source for the
# openai-chatgpt provider, which serves ChatGPT subscriptions rather than OpenAI API accounts.
# Tier mapping: Terra handles balanced roles, Luna handles fast work, and Sol handles deep roles.
# Each tier falls back to the quoted base-model glob for pre-tier accounts; resolver order is top-to-bottom.
# The provider supports at most `high` reasoning effort here, so former `xhigh` intent maps to `high`.

name: openai-chatgpt
description: "ChatGPT subscription routing. All roles use openai-chatgpt models exclusively."
updated: "2026-09-01"

roles:
  general:
    description: "Versatile catch-all, no specialization needed"
    candidates:
      - provider: openai-chatgpt
        model: gpt-?.?-terra*
        config:
          reasoning_effort: high
      - provider: openai-chatgpt
        model: "gpt-[0-9].[0-9]"
        config:
          reasoning_effort: high

  fast:
    description: "Quick utility tasks — parsing, classification, file ops, bulk work"
    candidates:
      - provider: openai-chatgpt
