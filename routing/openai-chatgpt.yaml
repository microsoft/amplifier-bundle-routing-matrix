# Routing Matrix: openai-chatgpt
#
# ChatGPT-backend routing. All roles use the `openai-chatgpt` provider
# exclusively -- the OAuth/ChatGPT-subscription backend, which is a SEPARATE
# provider module from `openai` (the API-key backend), not a second instance
# of it. A `provider: openai` candidate therefore does NOT match it: neither
# by name nor via find_provider_by_type's module-type fallback.
#
# Mirrors openai.yaml role for role: terra for work, luna for `fast` and for
# `ui-coding` at maximum effort. Same two-glob, no-fallback discipline.
#
# TWO THINGS ARE DIFFERENT FROM openai.yaml, both load-bearing:
#
# 1. THE GLOBS HAVE NO TRAILING `*`. This backend also serves `-fast`
#    variants (`gpt-5.6-terra-fast`, `gpt-5.6-luna-fast`, `gpt-5.6-sol-fast`).
#    `gpt-?.?-terra*` matches BOTH ids, they tie on version, and the
#    resolver's tie-break picks the LONGER name -- so the glob silently
#    selects the `-fast` variant. `gpt-?.?-terra` matches the standard id
#    only. Same trap as `gpt-5.6-sol-fast` on GitHub Copilot.
#
# 2. EFFORT IS SET VIA `extra_request_params`, NOT `reasoning_effort`. This
#    provider reads no effort key from mount config -- its only effort read is
#    `request.reasoning_effort`, a ChatRequest field nothing populates from
#    config. A `reasoning_effort:` here would be INERT at every value, and the
#    loader rejects it (matrix_loader.INERT_CONFIG_RULES). The provider builds
#    `payload["reasoning"] = {"effort": ..., "summary": "detailed"}`
#    (provider.py:720-724) and merges `extra_request_params` into the payload
#    last (:731-732), so setting that same block by hand lands on the wire in
#    exactly the shape the provider itself would have produced.
#
# NO `preset:` BLOCK. Knob-consistent delegation is default-ON for openai.yaml
# because it was MEASURED there. There is no equivalent measurement for this
# backend, so it stays default-off -- the same guardrail anthropic.yaml gets.
# Note also that a preset's `tier_ladder` is keyed by the matrix `provider:`
# string verbatim (knob_consistency.py:420), so adding one here would need its
# own `openai-chatgpt:` ladder entry; borrowing openai's would not apply.
#
# Required roles: "general" and "fast" must be defined in every matrix.
# See docs/MATRIX_CURATOR_GUIDE.md for schema details.
#
# --- Review log ---
# 2026-09-07: Created. Verified against the live provider list_models():
#   gpt-6-astra, gpt-5.6-sol, gpt-5.6-terra, gpt-5.6-luna, gpt-5.5,
#   gpt-5.4-mini, each with a `-fast` sibling. Before this file existed, a
#   user whose ONLY provider was openai-chatgpt got ZERO routing from every
#   shipped matrix -- all 13 roles of balanced.yaml resolved to nothing.

name: openai-chatgpt
description: "ChatGPT-backend routing. All roles use the openai-chatgpt provider exclusively. Suffix-free globs avoid the -fast variants; effort rides extra_request_params."
updated: "2026-09-07"

roles:
  general:
    description: "Versatile catch-all, no specialization needed"
    candidates:
      - provider: openai-chatgpt
        model: gpt-?.?-terra
        config:
          extra_request_params:
            reasoning:
              effort: high
              summary: detailed

  fast:
    description: "Quick utility tasks — parsing, classification, file ops, bulk work"
    candidates:
      - provider: openai-chatgpt
        model: gpt-?.?-luna
        config:
          extra_request_params:
            reasoning:
              effort: medium
              summary: detailed

  coding:
    description: "Code generation, implementation, debugging"
    candidates:
      - provider: openai-chatgpt
        model: gpt-?.?-terra
        config:
          extra_request_params:
            reasoning:
              effort: high
              summary: detailed

  ui-coding:
    description: "Frontend/UI code — components, layouts, styling, spatial reasoning"
    candidates:
      - provider: openai-chatgpt
        model: gpt-?.?-luna
        config:
          extra_request_params:
            reasoning:
              effort: max
              summary: detailed

  security-audit:
    description: "Vulnerability assessment, attack surface analysis, code auditing"
    candidates:
      - provider: openai-chatgpt
        model: gpt-?.?-terra
        config:
          extra_request_params:
            reasoning:
              effort: xhigh
              summary: detailed

  reasoning:
    description: "Deep architectural reasoning, system design, complex multi-step analysis"
