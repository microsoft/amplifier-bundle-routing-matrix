# Exact-module selection profile; not account consent or dispatch containment.
name: openai-api
description: "OpenAI API module only, with the legacy OpenAI role and delegation policy."
updated: "2026-10-02"
provider_module_allowlist: [provider-openai]

preset:
  axis: [cheap, fast]
  tier_ladder:
    openai:
      - ["gpt-[6-9]*-luna", "gpt-[0-9]*-luna*", "gpt-?.?-mini*", "gpt-?.?-nano*"]
      - ["gpt-?.?-terra*"]
      - ["gpt-[0-9]*-sol*", "gpt-[0-9]*-astra*", "gpt-[0-9].[0-9]"]
  delegation:
    inherit: strict
    report_unhonored: true

roles:
  general:
    description: "Versatile catch-all, no specialization needed"
    candidates:
      - provider: openai
        model: gpt-6.1-sol
        config:
          reasoning_effort: high
  fast:
    description: "Quick utility tasks — parsing, classification, file ops, bulk work"
    candidates:
      - provider: openai
        model: "gpt-[6-9]*-luna"
        config:
          reasoning_effort: medium
  coding:
    description: "Code generation, implementation, debugging"
    candidates:
      - provider: openai
        model: gpt-6.1-sol
        config:
          reasoning_effort: high
  ui-coding:
    description: "Frontend/UI code — components, layouts, styling, spatial reasoning"
    candidates:
      - provider: openai
        model: "gpt-[6-9]*-luna"
        config:
          reasoning_effort: max
  security-audit:
    description: "Vulnerability assessment, attack surface analysis, code auditing"
    candidates:
      - provider: openai
        model: gpt-6.1-sol
        config:
          reasoning_effort: xhigh
  reasoning:
    description: "Deep architectural reasoning, system design, complex multi-step analysis"
    candidates:
      - provider: openai
        model: gpt-6.1-sol
        config:
          reasoning_effort: xhigh
  critique:
    description: "Analytical evaluation — finding flaws in existing work, not generating solutions"
    candidates:
      - provider: openai
        model: gpt-6.1-sol
        config:
          reasoning_effort: xhigh
  creative:
    description: "Design direction, aesthetic judgment, high-quality creative output"
    candidates:
      - provider: openai
        model: gpt-6.1-sol
        config:
          reasoning_effort: high
  writing:
    description: "Long-form content — documentation, marketing, case studies, storytelling"
    candidates:
      - provider: openai
        model: gpt-6.1-sol
        config:
          reasoning_effort: high
  research:
    description: "Deep investigation, information synthesis across multiple sources"
    candidates:
      - provider: openai
        model: gpt-6.1-sol
        config:
          reasoning_effort: xhigh
  vision:
    description: "Understanding visual input — screenshots, diagrams, UI mockups"
    candidates:
      - provider: openai
        model: gpt-6.1-sol
        config:
          reasoning_effort: medium
  image-gen:
    description: "Image generation (limited — gpt-image not available via chat API)"
    candidates:
      - provider: openai
        model: gpt-6.1-sol
        config:
          reasoning_effort: high
  critical-ops:
    description: "High-reliability operational tasks — infrastructure, orchestration, coordination"
    candidates:
      - provider: openai
        model: gpt-6.1-sol
        config:
          reasoning_effort: xhigh