# Routing Matrix: openai
#
# OpenAI-only routing. All roles use OpenAI models exclusively.
# Use when you want to run entirely on your OpenAI API account.
#
# TIER STATUS (2026-09-07): the flagship `gpt-?.?-sol*` tier is PAUSED pending
# further evals. No role selects sol. Roles that previously did now use
# `gpt-?.?-terra*` one effort notch higher, clamped at xhigh.
#
# `luna` is used for exactly two roles: `fast` (cheap utility work) and
# `ui-coding`, the latter at `max` effort -- cheapest tier, maximum thinking.
#
# TWO GLOBS, NO FALLBACKS. Every candidate in this file is either
# `gpt-?.?-terra*` or `gpt-?.?-luna*`. The `gpt-[0-9].[0-9]` base-alias twin
# (a pre-5.6 migration fallback) and the `gpt-?.?-mini*` rung are both gone --
# gpt-5.6 terra and luna are live on the openai list_models(), so neither
# fallback bought anything.
#
# CONSEQUENCE, STATED PLAINLY: EVERY role here now has exactly ONE candidate,
# and provider-openai has no static model-list fallback (`list_models()`
# docstring: "no fallback; caller handles empty lists"). If that call fails,
# the glob resolves to nothing and the role yields no preference at all -- the
# agent falls back to the session's default provider rather than erroring. If
# that degradation is not acceptable, add a pinned exact name (e.g.
# `gpt-5.6-terra`) as a second candidate: an exact name never calls
# list_models(), which is the same glob+pin shape copilot.yaml uses.
#
# NOTE: `gpt-?.?-sol*` is deliberately RETAINED on the preset tier ladder
# below even though nothing routes to it. The ladder describes the provider
# family for knob-consistent tier comparison; removing the rung would
# misclassify a sol model that a user pins by hand. With the base alias gone
# from the roles, nothing resolves onto the sol rung any more, so a terra-tier
# caller can no longer be clamped by a fallback sitting a rung above it.
#
# Knob-consistent delegation is ON by default for this matrix (measured win on
# OpenAI roots: `gpt-5.6-sol` call share 27.8% -> 0.0%, cost -29.7% (S3 median)
# / -55.9% (S1), wall -16.2%, quality flat). Scope: OpenAI-family roots only --
# every other shipped matrix is untouched by the preset. Opt out with
# `disable_delegation_preset: true` in this hook's mount config to restore
# legacy (pre-2026-09-02) behaviour.
#
# NOTE (2026-09-07): `openai-knob-consistent.yaml` has been DELETED. It shipped
# as an opt-in arm carrying a byte-identical preset block; once the preset
# became this matrix's default on 2026-09-02 the two files were functionally
# the same file under two names. Select `openai` instead.
#
# --- Review log ---
# 2026-09-07: Curator refresh, verified against LIVE provider list_models()
#   output on 2026-09-07 (anthropic, openai, gemini, github-copilot).
#   1. OpenAI flagship (`gpt-?.?-sol*`) PAUSED pending further evals -- every
#      sol candidate moved down one tier to `gpt-?.?-terra*` and up one effort
#      notch, CLAMPED at xhigh (no `max`): bare -> high, low -> medium,
#      medium -> high, high -> xhigh, xhigh -> xhigh. (`ui-coding` is the one
#      exception -- see item 8.) See also item 6: the `gpt-[0-9].[0-9]`
#      migration-fallback twin is gone entirely.
#   2. Gemini globs re-anchored `gemini-[3-9]*-...`. The old
#      `gemini-*-flash-preview` resolved to `gemini-omni-flash-preview` (the
#      Omni lane, not the Flash lane) AND missed gemini-3.5/3.6/3.7/3.8-flash
#      entirely, because Google dropped the `-preview` suffix. Verified with
#      the shipped `_version_sort_key`.
#   3. Gemini thinking is now requested through the knob the provider actually
#      reads -- `extra_request_params.thinking_config.thinking_level`. A
#      `reasoning_effort` on a gemini candidate is INERT at every value (see
#      matrix_loader.INERT_CONFIG_RULES) and is rejected by the loader.
#      Gemini's ceiling is `high`; there is no xhigh/max. `minimal` is NOT
#      used -- gemini-3.8-flash errors on it.
#   4. Image generation retargeted `nano-banana-pro-preview` ->
#      `gemini-3-pro-image`. The old name is absent from list_models() and
#      from every first-party Google source; `gemini-3-pro-image` is the GA
#      flagship image model ("Nano Banana Pro"). No thinking_level: Gemini 3
#      image models think by default and expose no level knob.
#   5. GitHub Copilot pins refreshed to the newest models the live API lists
#      (claude-sonnet-5, claude-opus-5, gpt-5.5). This also fixes an invalid
#      effort: claude-sonnet-4.6 and claude-opus-4.6 accept only
#      low/medium/high/max -- an `xhigh` on either was silently wrong. The
#      repo test passes a provider-wide superset, so it did not catch this.
#   6. The `gpt-[0-9].[0-9]` twin was DROPPED from every openai candidate.
#      It existed as a pre-5.6 migration fallback; `gpt-5.6-terra` and
#      `gpt-5.6-luna` are both confirmed present on the live openai
#      list_models(), so a fallback to gpt-5.5-or-earlier buys nothing. The
#      Copilot GPT slots moved the same generation for the same reason
#      (`gpt-?.?-terra*` + `gpt-5.6-terra`, both live on the Copilot API).
#   7. NO CANDIDATE IS LEFT WITH A BLANK EFFORT. An unset knob is not a
#      neutral default to reason about, so every candidate that can carry one
#      now says what it wants; `medium` where nothing more specific was
#      established. Three exceptions, all enforced by the loader rather than
#      chosen here (matrix_loader.INERT_CONFIG_RULES):
#        * claude-haiku-* on ANY provider -- `reasoning_effort` is REJECTED at
#          every value (measured: effort absent on the wire, budget pinned at
#          32000). Its documented replacement is `thinking_budget_tokens`.
#        * gemini/* -- `reasoning_effort` is REJECTED; `thinking_level` is the
#          live knob and is set on every gemini candidate except flash-lite,
#          where Google documents no levels for the text models.
#        * ollama `model: "*"` -- no effort knob exists.
#   8. `ui-coding` is `gpt-?.?-luna*` at `max` effort on EVERY matrix that
#      routes to openai -- cheap tier, maximum thinking.
#   9. OpenAI is now TERRA-OR-LUNA ONLY. The `gpt-?.?-mini*` and
#      `gpt-?.?-nano*` rungs were removed alongside the `gpt-[0-9].[0-9]`
#      twin (item 6): with sol paused, every openai candidate in every matrix
#      is one of exactly two globs -- `gpt-?.?-terra*` (work) or
#      `gpt-?.?-luna*` (cheap/fast, and `ui-coding` at max effort). There are
#      no openai fallback rungs left at all.
#  10. Haiku carries `thinking_budget_tokens: 32000` instead of a blank. The
#      loader REJECTS `reasoning_effort` on any model whose name contains
#      'haiku', under any provider -- it collapses every level above 'low'
#      into one identical request. 32000 is what `medium` resolves to and what
#      a blank already produced on the wire, so this is explicit, not a
#      behaviour change. REVISIT WHEN HAIKU 5 SHIPS: if it gains real effort
#      support, swap back to `reasoning_effort` -- and note the guard rule
#      itself must be updated in the same change, since it matches the
#      substring 'haiku' and would otherwise keep rejecting claude-haiku-5.

name: openai
description: "OpenAI-only routing. All roles use OpenAI models exclusively. Flagship (sol) tier paused pending evals; knob-consistent delegation ON by default -- sub-agents inherit the caller's tier/effort ceiling."
updated: "2026-09-07"

# ---------------------------------------------------------------------------
# Knob-consistent delegation preset -- DEFAULT ON for this matrix.
# ---------------------------------------------------------------------------
preset:
  # Documentation only; never read by code.
  axis: [cheap, fast]

  # Cheapest -> most expensive, per provider family. Declared, never inferred
  # from price: no per-token price for the 5.6 family exists in any guide, so
  # this encodes the vendor's own ordinal statements (luna lowest cost, terra
  # mid, sol flagship). A rung may be one glob or a list of globs.
  #
  # `gpt-[0-9].[0-9]` sits on the SOL rung on purpose: since the 5.6 rename the
  # bare alias points at the flagship tier.
  tier_ladder:
    openai:
      - ["gpt-?.?-luna*", "gpt-?.?-mini*", "gpt-?.?-nano*"]
      - ["gpt-?.?-terra*"]
      - ["gpt-?.?-sol*", "gpt-[0-9].[0-9]"]

  delegation:
    # none | effort | tier-and-effort | strict
    #
    # `strict` matches the measured arm exactly (l1-knob-consistent-routing
    # shipped and measured `strict`, not `tier-and-effort` + escalation) --
    # this default follows the evidence, not a stronger untested claim.
    inherit: strict
    report_unhonored: true

roles:
  general:
    description: "Versatile catch-all, no specialization needed"
    candidates:
      - provider: openai
        model: gpt-?.?-terra*
        config:
          reasoning_effort: high

  fast:
    description: "Quick utility tasks — parsing, classification, file ops, bulk work"
    candidates:
      - provider: openai
        model: gpt-?.?-luna*
        config:
          reasoning_effort: medium

  coding:
    description: "Code generation, implementation, debugging"
    candidates:
      - provider: openai
        model: gpt-?.?-terra*
        config:
          reasoning_effort: high

  ui-coding:
    description: "Frontend/UI code — components, layouts, styling, spatial reasoning"
    candidates:
      - provider: openai
        model: gpt-?.?-luna*
        config:
          reasoning_effort: max

  security-audit:
    description: "Vulnerability assessment, attack surface analysis, code auditing"
    candidates:
      - provider: openai
        model: gpt-?.?-terra*
        config:
          reasoning_effort: xhigh

  reasoning:
    description: "Deep architectural reasoning, system design, complex multi-step analysis"
    candidates:
      - provider: openai
        model: gpt-?.?-terra*
        config:
          reasoning_effort: xhigh

  critique:
    description: "Analytical evaluation — finding flaws in existing work, not generating solutions"
    candidates:
      - provider: openai
        model: gpt-?.?-terra*
        config:
          reasoning_effort: xhigh

  creative:
    description: "Design direction, aesthetic judgment, high-quality creative output"
    candidates:
      - provider: openai
        model: gpt-?.?-terra*
        config:
          reasoning_effort: high

  writing:
    description: "Long-form content — documentation, marketing, case studies, storytelling"
    candidates:
      - provider: openai
        model: gpt-?.?-terra*
        config:
          reasoning_effort: high

  research:
    description: "Deep investigation, information synthesis across multiple sources"
    candidates:
      - provider: openai
        model: gpt-?.?-terra*
        config:
          reasoning_effort: xhigh

  vision:
    description: "Understanding visual input — screenshots, diagrams, UI mockups"
    candidates:
      - provider: openai
        model: gpt-?.?-terra*
        config:
          reasoning_effort: medium

  image-gen:
    description: "Image generation (limited — gpt-image not available via chat API)"
    candidates:
      - provider: openai
        model: gpt-?.?-terra*
        config:
          reasoning_effort: high

  critical-ops:
    description: "High-reliability operational tasks — infrastructure, orchestration, coordination"
    candidates:
      - provider: openai
        model: gpt-?.?-terra*
        config:
          reasoning_effort: xhigh
