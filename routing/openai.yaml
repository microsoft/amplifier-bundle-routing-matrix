# Routing Matrix: openai
#
# OpenAI-only routing. All roles use OpenAI models exclusively.
# Use when you want to run entirely on your OpenAI API account.
#
# Glob strategy: tier suffixes (`gpt-?.?-sol*` flagship, `gpt-?.?-terra*` mid,
# `gpt-?.?-luna*` cheap, `gpt-?.?-mini*`, `gpt-?.?-nano*`) auto-track minor
# version bumps without matching the wrong tier. The mid tier uses
# `gpt-?.?-terra*`, falling back to the base glob `gpt-[0-9].[0-9]` which matches
# any single-digit major.minor base model (e.g. gpt-5.5) without matching suffix
# variants (-sol, -terra, -luna, -mini, -pro, -nano) or dated snapshots.
# IMPORTANT: since the 5.6 rename, the bare `gpt-5.6` alias points at the
# flagship (sol) tier, so the base glob is a migration fallback for pre-5.6
# accounts (where the un-suffixed model WAS the mid tier) -- not the primary
# mid-tier candidate. Mid-tier roles (general, coding, ui-coding,
# security-audit, critique, vision) try `gpt-?.?-terra*` first, then the base
# glob. Flagship roles (reasoning, creative, writing, research, critical-ops)
# try `gpt-?.?-sol*` first, then fall back to the base glob; the cheap `fast`
# role tries `gpt-?.?-luna*` then `gpt-?.?-mini*`. The resolver's version-aware
# sort picks the highest available version automatically; an unmatched glob
# falls through to the next candidate, so accounts mid-migration degrade
# gracefully.
#
# reasoning_effort pin on the workhorse roles (2026-09-01): general, coding,
# and ui-coding now pin `reasoning_effort: high` on their terra candidates.
# Evidence: a DTU rebaseline wave (S1 diagnostic + S3 5-turn multi-turn
# build, n=2 each) found gpt-5.6-terra @ high scored 2/2 on both scenarios,
# while gpt-5.6-sol @ xhigh could not complete a single run inside a 30-minute
# cap on either scenario, at ~3-7x the cost. A prior dial-in wave
# (2026-08-30) corroborated terra-high across S1/S3/S4. Both candidates
# (terra glob and the base-glob migration fallback) carry the same pin so
# pre-5.6 accounts inherit the same effort. n=2 per cell; sol's S1
# non-completions are cap-bounded, not graded-wrong -- see PR description
# for the full write-up. security-audit and critique were left untouched:
# they already pin terra @ xhigh (a separate, pre-existing design, not sol),
# outside this evidence's scope. reasoning and critical-ops were left
# untouched: they already pin sol (xhigh and high respectively) and the
# deep-diagnosis (S4) evidence still favors sol at high+ effort over sol at
# medium. creative/writing/research/vision/image-gen are untouched -- terra
# is untested on those task shapes.
#
# Knob-consistent delegation, DEFAULT ON (2026-09-02): a session pins
# model/effort for the ROOT only -- sub-agents are routed by this matrix, so
# the caller's dial used to govern only the root's own work. MEASURED (lane
# l1-knob-consistent-routing, DONE.json + ai-notes/w2-s3-three-knob-presets/
# ROUTING-PROPOSAL.md; S3 n=3/arm on OpenAI roots): `gpt-5.6-sol` call share
# 27.8% -> 0.0%, cost -29.7% (S3 median) / -55.9% (S1), wall -16.2%, quality
# flat. This is a PROVEN WIN, not an experiment -- see the `preset:` block
# below (identical to the one `openai-knob-consistent.yaml` shipped as an
# opt-in arm) and README "Knob-consistent delegation" for the full writeup.
# Scope: OpenAI-family roots only. Every other shipped matrix (anthropic,
# balanced, quality, economy, gemini, copilot, ollama) is UNTOUCHED and
# resolves byte-identically to before -- there is no equivalent evidence yet
# for other provider families (the "Anthropic guardrail": no measured win,
# so no default change there). Opt out with `disable_delegation_preset:
# true` in this hook's mount config to restore legacy (pre-2026-09-02)
# behaviour on this matrix.

name: openai
description: "OpenAI-only routing. All roles use OpenAI models exclusively. Knob-consistent delegation is ON by default (measured win) -- sub-agents inherit the caller's tier/effort ceiling; see preset: below."
updated: "2026-09-02"

# ---------------------------------------------------------------------------
# Knob-consistent delegation preset -- DEFAULT ON for this matrix (measured
# win on OpenAI roots, see header above). Byte-identical to the preset block
# `openai-knob-consistent.yaml` ships (that file remains as an explicit-name
# pin for anyone who wants to select it by name; both now behave the same).
# ---------------------------------------------------------------------------
preset:
  # Documentation only; never read by code.
  axis: [cheap, fast]

  # Cheapest -> most expensive, per provider family. Declared, never inferred
  # from price: no per-token price for the 5.6 family exists in any guide, so
  # this encodes the vendor's own ordinal statements (luna lowest cost, terra
  # mid, sol flagship). A rung may be one glob or a list of globs.
  #
  # `gpt-[0-9].[0-9]` sits on the SOL rung on purpose: since the 5.6 rename the
  # bare alias points at the flagship tier (see header above).
  tier_ladder:
    openai:
      - ["gpt-?.?-luna*", "gpt-?.?-mini*", "gpt-?.?-nano*"]
      - ["gpt-?.?-terra*"]
      - ["gpt-?.?-sol*", "gpt-[0-9].[0-9]"]

  delegation:
    # none | effort | tier-and-effort | strict
    #
    # `strict` matches the measured arm exactly (l1-knob-consistent-routing
    # shipped and measured `strict`, not `tier-and-effort` + escalation) --
    # this default follows the evidence, not a stronger untested claim.
    inherit: strict
    report_unhonored: true


roles:
  general:
    description: "Versatile catch-all, no specialization needed"
    candidates:
      - provider: openai
        model: gpt-?.?-terra*
        config:
          reasoning_effort: high
      - provider: openai
        model: "gpt-[0-9].[0-9]"
        config:
          reasoning_effort: high

  fast:
    description: "Quick utility tasks — parsing, classification, file ops, bulk work"
    candidates:
      - provider: openai
        model: gpt-?.?-luna*
      - provider: openai
        model: gpt-?.?-mini*

  coding:
    description: "Code generation, implementation, debugging"
    candidates:
      - provider: openai
        model: gpt-?.?-terra*
        config:
          reasoning_effort: high
      - provider: openai
        model: "gpt-[0-9].[0-9]"
        config:
          reasoning_effort: high

  ui-coding:
