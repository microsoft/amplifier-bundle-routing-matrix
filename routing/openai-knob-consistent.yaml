      - provider: openai
        model: "gpt-[0-9].[0-9]"
        config:
          reasoning_effort: high

  security-audit:
    description: "Vulnerability assessment, attack surface analysis, code auditing"
    candidates:
      - provider: openai
        model: gpt-?.?-terra*
        config:
          reasoning_effort: xhigh
      - provider: openai
        model: "gpt-[0-9].[0-9]"
        config:
          reasoning_effort: xhigh

  reasoning:
    description: "Deep architectural reasoning, system design, complex multi-step analysis"
    candidates:
      - provider: openai
        model: gpt-?.?-sol*
        config:
          reasoning_effort: xhigh
      - provider: openai
        model: "gpt-[0-9].[0-9]"
        config:
          reasoning_effort: xhigh

  critique:
    description: "Analytical evaluation — finding flaws in existing work, not generating solutions"
    candidates:
      - provider: openai
        model: gpt-?.?-terra*
        config:
          reasoning_effort: xhigh
      - provider: openai
        model: "gpt-[0-9].[0-9]"
        config:
          reasoning_effort: xhigh

  creative:
    description: "Design direction, aesthetic judgment, high-quality creative output"
    candidates:
      - provider: openai
        model: gpt-?.?-sol*
      - provider: openai
        model: "gpt-[0-9].[0-9]"

  writing:
    description: "Long-form content — documentation, marketing, case studies, storytelling"
    candidates:
      - provider: openai
        model: gpt-?.?-sol*
      - provider: openai
        model: "gpt-[0-9].[0-9]"

  research:
    description: "Deep investigation, information synthesis across multiple sources"
    candidates:
      - provider: openai
        model: gpt-?.?-sol*
        config:
          reasoning_effort: high
      - provider: openai
        model: "gpt-[0-9].[0-9]"
