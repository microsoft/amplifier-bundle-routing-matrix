          reasoning_effort: high
      - provider: github-copilot
        model: claude-sonnet-5
        config:
          reasoning_effort: high
      - provider: github-copilot
        model: gpt-?.?-terra*
        config:
          reasoning_effort: high
      - provider: github-copilot
        model: gpt-5.6-terra
        config:
          reasoning_effort: high

  reasoning:
    description: "Deep architectural reasoning, system design, complex multi-step analysis"
    candidates:
