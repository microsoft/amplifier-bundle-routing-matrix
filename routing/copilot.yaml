# Routing Matrix: copilot
#
# GitHub Copilot-optimized routing. Balances Copilot multiplier costs.
# Avoids the 30x claude-opus-fast trap. Uses Haiku (0.33x) for budget roles.
# Use when GitHub Copilot is your primary or only provider.
#
# GLOB + PIN PAIRS (changed 2026-09-07). Every candidate that used to be a
# lone pin is now a PAIR: a class-scoped glob first, the newest known pin
# immediately after as a last-resort fallback.
#
# WHY BOTH. The github-copilot provider still has NO static fallback for
# `list_models()` -- it raises ProviderUnavailableError when the SDK and the
# disk cache are both unavailable (provider v2.7.0, models.py:215;
# `config/_models.py:FALLBACKS` is token-window defaults, not a model list).
# Glob-only would therefore fail catastrophically offline, which is why
# docs/MATRIX_CURATOR_GUIDE.md said to keep Copilot pinned. But the resolver
# does NOT propagate that failure: `_resolve_glob` catches it, logs, and
# returns None (resolver.py:532), so resolution falls through to the next
# candidate. Pairing gets both properties -- the glob auto-tracks new Copilot
# releases when the API is reachable, and the pin still resolves when it is
# not, because an exact name never calls list_models() at all.
#
# The pins are therefore expected to duplicate what the glob resolves to
# today. That is not redundancy; the pin is the offline path.
#
# GPT slots use the `gpt-?.?-terra*` tier glob (-> gpt-5.6-terra), pinned to
# `gpt-5.6-terra`. Do NOT add `gpt-?.?-sol*` here: on the live Copilot list it
# resolves to `gpt-5.6-sol-fast`, which the API labels "Internal only" -- two
# ids tie at 5.6 and the longer name wins.
#
# --- Review log ---
# 2026-09-07: Curator refresh, verified against LIVE provider list_models()
#   output on 2026-09-07 (anthropic, openai, gemini, github-copilot).
#   1. OpenAI flagship (`gpt-?.?-sol*`) PAUSED pending further evals -- every
#      sol candidate moved down one tier to `gpt-?.?-terra*` and up one effort
#      notch, CLAMPED at xhigh (no `max`): bare -> high, low -> medium,
#      medium -> high, high -> xhigh, xhigh -> xhigh. (`ui-coding` is the one
#      exception -- see item 8.) See also item 6: the `gpt-[0-9].[0-9]`
#      migration-fallback twin is gone entirely.
#   2. Gemini globs re-anchored `gemini-[3-9]*-...`. The old
#      `gemini-*-flash-preview` resolved to `gemini-omni-flash-preview` (the
#      Omni lane, not the Flash lane) AND missed gemini-3.5/3.6/3.7/3.8-flash
#      entirely, because Google dropped the `-preview` suffix. Verified with
#      the shipped `_version_sort_key`.
#   3. Gemini thinking is now requested through the knob the provider actually
#      reads -- `extra_request_params.thinking_config.thinking_level`. A
#      `reasoning_effort` on a gemini candidate is INERT at every value (see
#      matrix_loader.INERT_CONFIG_RULES) and is rejected by the loader.
#      Gemini's ceiling is `high`; there is no xhigh/max. `minimal` is NOT
#      used -- gemini-3.8-flash errors on it.
#   4. Image generation retargeted `nano-banana-pro-preview` ->
#      `gemini-3-pro-image`. The old name is absent from list_models() and
#      from every first-party Google source; `gemini-3-pro-image` is the GA
#      flagship image model ("Nano Banana Pro"). No thinking_level: Gemini 3
#      image models think by default and expose no level knob.
#   5. GitHub Copilot pins refreshed to the newest models the live API lists
#      (claude-sonnet-5, claude-opus-5, gpt-5.5). This also fixes an invalid
#      effort: claude-sonnet-4.6 and claude-opus-4.6 accept only
#      low/medium/high/max -- an `xhigh` on either was silently wrong. The
#      repo test passes a provider-wide superset, so it did not catch this.
#   6. The `gpt-[0-9].[0-9]` twin was DROPPED from every openai candidate.
#      It existed as a pre-5.6 migration fallback; `gpt-5.6-terra` and
#      `gpt-5.6-luna` are both confirmed present on the live openai
#      list_models(), so a fallback to gpt-5.5-or-earlier buys nothing. The
#      Copilot GPT slots moved the same generation for the same reason
#      (`gpt-?.?-terra*` + `gpt-5.6-terra`, both live on the Copilot API).
#   7. NO CANDIDATE IS LEFT WITH A BLANK EFFORT. An unset knob is not a
#      neutral default to reason about, so every candidate that can carry one
#      now says what it wants; `medium` where nothing more specific was
#      established. Three exceptions, all enforced by the loader rather than
#      chosen here (matrix_loader.INERT_CONFIG_RULES):
#        * claude-haiku-* on ANY provider -- `reasoning_effort` is REJECTED at
#          every value (measured: effort absent on the wire, budget pinned at
#          32000). Its documented replacement is `thinking_budget_tokens`.
#        * gemini/* -- `reasoning_effort` is REJECTED; `thinking_level` is the
#          live knob and is set on every gemini candidate except flash-lite,
#          where Google documents no levels for the text models.
#        * ollama `model: "*"` -- no effort knob exists.
#   8. `ui-coding` is `gpt-?.?-luna*` at `max` effort on EVERY matrix that
#      routes to openai -- cheap tier, maximum thinking.
#   9. OpenAI is now TERRA-OR-LUNA ONLY. The `gpt-?.?-mini*` and
#      `gpt-?.?-nano*` rungs were removed alongside the `gpt-[0-9].[0-9]`
#      twin (item 6): with sol paused, every openai candidate in every matrix
#      is one of exactly two globs -- `gpt-?.?-terra*` (work) or
#      `gpt-?.?-luna*` (cheap/fast, and `ui-coding` at max effort). There are
#      no openai fallback rungs left at all.
#  10. Haiku carries `thinking_budget_tokens: 32000` instead of a blank. The
#      loader REJECTS `reasoning_effort` on any model whose name contains
#      'haiku', under any provider -- it collapses every level above 'low'
#      into one identical request. 32000 is what `medium` resolves to and what
#      a blank already produced on the wire, so this is explicit, not a
#      behaviour change. REVISIT WHEN HAIKU 5 SHIPS: if it gains real effort
#      support, swap back to `reasoning_effort` -- and note the guard rule
#      itself must be updated in the same change, since it matches the
#      substring 'haiku' and would otherwise keep rejecting claude-haiku-5.

name: copilot
description: "GitHub Copilot-optimized routing. Balances multiplier costs, avoids 30x trap. Class globs with pinned offline fallbacks."
updated: "2026-09-07"

roles:
  general:
    description: "Versatile catch-all, no specialization needed"
    candidates:
      - provider: github-copilot
        model: claude-haiku-*
        # Haiku collapses every effort level above 'low' into ONE request, so
        # `reasoning_effort` is rejected outright by the loader
        # (matrix_loader.INERT_CONFIG_RULES). 32000 is the dial Haiku really
        # reads, and is exactly what both `medium` and a blank already
        # produced on the wire -- explicit, not a behaviour change.
        # REVISIT WHEN HAIKU 5 SHIPS: if it gains real effort support, swap
        # this back to `reasoning_effort`. The guard is keyed on the model
        # substring 'haiku' under ANY provider, so claude-haiku-5 will keep
        # being rejected until that rule is updated too.
        config:
          thinking_budget_tokens: 32000
      - provider: github-copilot
        model: claude-haiku-4.5
        # Haiku collapses every effort level above 'low' into ONE request, so
        # `reasoning_effort` is rejected outright by the loader
        # (matrix_loader.INERT_CONFIG_RULES). 32000 is the dial Haiku really
        # reads, and is exactly what both `medium` and a blank already
        # produced on the wire -- explicit, not a behaviour change.
        # REVISIT WHEN HAIKU 5 SHIPS: if it gains real effort support, swap
        # this back to `reasoning_effort`. The guard is keyed on the model
        # substring 'haiku' under ANY provider, so claude-haiku-5 will keep
        # being rejected until that rule is updated too.
        config:
          thinking_budget_tokens: 32000

  fast:
    description: "Quick utility tasks — parsing, classification, file ops, bulk work"
    candidates:
      - provider: github-copilot
        model: claude-haiku-*
        # Haiku collapses every effort level above 'low' into ONE request, so
        # `reasoning_effort` is rejected outright by the loader
        # (matrix_loader.INERT_CONFIG_RULES). 32000 is the dial Haiku really
