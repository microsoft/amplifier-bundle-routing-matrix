# Routing Matrix: ollama
#
# Ollama TEMPLATE matrix -- deliberately minimal.
#
# Every Ollama user runs a different set of locally-pulled models, so a curated
# per-role model list here is guesswork that goes stale the moment someone
# pulls something else. This matrix therefore ships only the two roles the
# loader REQUIRES (`general` and `fast`, see matrix_loader.py::validate_matrix)
# and points both at `model: "*"` -- "whatever this user actually has."
#
# `"*"` is the one universal free-pass glob (docs/MATRIX_CURATOR_GUIDE.md,
# "Curation Principles"): the resolver's version-aware sort picks the
# highest-ranked installed model.
#
# The 11 optional roles are intentionally ABSENT. An agent requesting one falls
# back through its own `model_role` list to `general`, which every matrix
# defines. Nothing breaks; there is simply no Ollama-specific opinion to state.
#
# TO SPECIALISE: copy this file, add the roles you care about, and pin the
# models you have actually pulled. A user override merges over this base --
# see docs/MATRIX_CURATOR_GUIDE.md.
#
# --- Review log ---
# 2026-09-07: Reduced from 12 roles to the required 2. The previous version
#   pinned `ollama-cloud/gpt-oss:120b`, `qwen3-coder*`, `deepseek-r1:*`,
#   `llama3.2:*`, `llava*` and `moondream*` across 12 roles and additionally
#   required a SECOND provider instance (`ollama-cloud`) to be configured for
#   most of them to resolve at all. That is per-user configuration, not
#   curation, and it carried a maintenance cost no curator could discharge
#   (nobody here can verify which models a given user has pulled).

name: ollama
description: "Ollama template matrix. Minimal by design -- both required roles resolve to whatever models the user has installed."
updated: "2026-09-07"

roles:
  general:
    description: "Versatile catch-all, no specialization needed"
    candidates:
      - provider: ollama
        model: "*"

  fast:
    description: "Quick utility tasks — parsing, classification, file ops, bulk work"
    candidates:
      - provider: ollama
        model: "*"
