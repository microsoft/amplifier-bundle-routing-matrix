# Routing Matrix: anthropic
#
# Anthropic-only routing. All roles use Claude models exclusively.
# Use when you want to run entirely on your Anthropic API account.
#
# Uses class-scoped globs (claude-opus-*, claude-sonnet-*, claude-haiku-*) so
# new Claude releases are picked up automatically — the resolver's version-aware
# sort with date-suffix stripping selects the highest clean version.
#
# Required roles: "general" and "fast" must be defined in every matrix.
# See docs/MATRIX_CURATOR_GUIDE.md for schema details.
#
# --- Review log ---
# 2026-08-31: Evals-gated review of the claude-opus-4-8 -> claude-opus-5
#   transition (triggered by the claude-opus-5 release). NO CANDIDATE CHANGE
#   REQUIRED: every opus-tier role below (reasoning, creative, writing,
#   research, image-gen, critical-ops) already uses the unversioned
#   `claude-opus-*` glob, which the resolver's version-aware natural sort
#   (resolver.py::_version_sort_key) ranks by leading digit run and already
#   places claude-opus-5 above claude-opus-4-8 (5 > 4) with zero YAML edit --
#   confirmed by modules/hooks-routing/tests/test_resolver.py's existing
#   "claude-opus-5" fixtures. Gated by two DTU evaluation waves (dial-in
#   2026-08-30, rebaseline 2026-09-01); see the PR description that
#   introduced this log entry for full evidence. This entry records that the
#   review happened and concluded "no edit needed," per
#   docs/MATRIX_CURATOR_GUIDE.md's refresh process (trigger: major model
#   release).

name: anthropic
description: "Anthropic-only routing. All roles use Claude models exclusively."
updated: "2026-08-31"

roles:
  general:
    description: "Versatile catch-all, no specialization needed"
    candidates:
      - provider: anthropic
        model: claude-sonnet-*

  fast:
    description: "Quick utility tasks — parsing, classification, file ops, bulk work"
    candidates:
      - provider: anthropic
        model: claude-haiku-*

  coding:
    description: "Code generation, implementation, debugging"
    candidates:
      - provider: anthropic
        model: claude-sonnet-*

  ui-coding:
    description: "Frontend/UI code — components, layouts, styling, spatial reasoning"
    candidates:
      - provider: anthropic
        model: claude-sonnet-*

  security-audit:
    description: "Vulnerability assessment, attack surface analysis, code auditing"
    candidates:
      - provider: anthropic
        model: claude-sonnet-*
        config:
          reasoning_effort: high

  reasoning:
    description: "Deep architectural reasoning, system design, complex multi-step analysis"
    candidates:
      - provider: anthropic
        model: claude-opus-*
        config:
          reasoning_effort: high

  critique:
    description: "Analytical evaluation — finding flaws in existing work, not generating solutions"
    candidates:
      - provider: anthropic
        model: claude-sonnet-*
        config:
          reasoning_effort: xhigh

  creative:
    description: "Design direction, aesthetic judgment, high-quality creative output"
    candidates:
      - provider: anthropic
        model: claude-opus-*

  writing:
    description: "Long-form content — documentation, marketing, case studies, storytelling"
    candidates:
      - provider: anthropic
        model: claude-opus-*

  research:
    description: "Deep investigation, information synthesis across multiple sources"
    candidates:
      - provider: anthropic
        model: claude-opus-*
        config:
          reasoning_effort: high

  vision:
    description: "Understanding visual input — screenshots, diagrams, UI mockups"
    candidates:
      - provider: anthropic
        model: claude-sonnet-*

  image-gen:
    # Anthropic has no native image generation API. Falls back to the best
    # creative model for image planning, prompt crafting, and SVG/ASCII art.
    description: "Image generation (limited — no native Anthropic image API)"
    candidates:
      - provider: anthropic
        model: claude-opus-*

  critical-ops:
    description: "High-reliability operational tasks — infrastructure, orchestration, coordination"
    candidates:
      - provider: anthropic
        model: claude-opus-*
