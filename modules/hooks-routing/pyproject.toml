[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amplifier-module-hooks-routing"
version = "0.1.1"
description = "Hook module for routing matrix model selection"
requires-python = ">=3.11"
dependencies = [
    "pyyaml",
    # Follow upstream policy; uv.lock records the exact qualified revision.
    # Requires the public model-pattern API introduced by Foundation PR #461.
    "amplifier-foundation @ git+https://github.com/microsoft/amplifier-foundation@main",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.entry-points."amplifier.modules"]
hooks-routing = "amplifier_module_hooks_routing:mount"

[tool.hatch.build.targets.wheel]
packages = ["amplifier_module_hooks_routing"]

[tool.hatch.metadata]
allow-direct-references = true
