[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amplifier-eval-openai-mount"
version = "0.1.0"
description = "Evaluation-only injection mount for the actual OpenAI provider"
requires-python = ">=3.11"
dependencies = []
license = "MIT"

[project.entry-points."amplifier.modules"]
provider-openai = "amplifier_module_eval_openai:mount"

[tool.hatch.build.targets.wheel]
packages = ["amplifier_module_eval_openai"]
dev-mode-dirs = ["."]