name: cand-qsr
description: "quality-slow-reasonable candidate"
updated: "2026-09-02"

preset:
  tier_ladder:
    openai:
      - ["gpt-?.?-luna*", "gpt-?.?-mini*", "gpt-?.?-nano*"]
      - ["gpt-?.?-terra*"]
      - ["gpt-?.?-sol*", "gpt-[0-9].[0-9]"]
  delegation:
    inherit: tier-and-effort
    escalate:
      allow_roles: [reasoning]
      max_uses: 3
      on_exhausted: fall_back

roles:
  general:
    description: "general"
    candidates:
      - provider: openai
        model: gpt-?.?-terra*
        config:
          reasoning_effort: medium
